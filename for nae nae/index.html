
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Little Pieces of Us 🍵🌸</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
    --pink: #F7A8C4;
    --soft-pink: #FFD6E8;
    --matcha: #A8C686;
    --dark-matcha: #6F8F52;
    --text: #5B5148;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;

    background:
    radial-gradient(circle at top left, #F7A8C4, transparent 45%),
    radial-gradient(circle at bottom right, #A8C686, transparent 45%),
    linear-gradient(135deg, #FFD6E8, #D8EBC2);
}

body::before {
    content: "🌸 🍃 🍵 🌸 🍃 🍵";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    font-size: 35px;
    letter-spacing: 25px;
    opacity: .25;
    animation: float 18s linear infinite;
    pointer-events: none;
    z-index: -1;
}

@keyframes float {
    from { transform: translateY(100vh); }
    to { transform: translateY(-120vh); }
}

.container {
    width: 100%;
    max-width: 850px;
    background: rgba(255,214,232,.65);
    backdrop-filter: blur(20px);
    border: 2px solid rgba(247,168,196,.6);
    border-radius: 35px;
    padding: 45px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(111,143,82,.25);
    animation: show .8s ease;
    position: relative;
}

@keyframes show {
    from {
        opacity: 0;
        transform: translateY(40px) scale(.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

h1 {
    font-size: 2.5rem;
    margin-bottom: 20px;
    background: linear-gradient(90deg, #E85D9E, #6F8F52);
    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    color: var(--text);
    line-height: 1.8;
    margin-bottom: 30px;
}

button {
    background: linear-gradient(135deg, #A8C686, #6F8F52);
    color: white;
    border: none;
    padding: 16px 40px;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: .35s;
    box-shadow: 0 12px 25px rgba(111,143,82,.35);
}

button:hover {
    transform: translateY(-5px) scale(1.05);
}

.hidden {
    display: none !important;
}

/* MEMORY CARD */

.cards {
    margin-top: 35px;
    display: grid;
    grid-template-columns: 1fr;
    max-width: 300px;
    margin-left: auto;
    margin-right: auto;
}

.card {
    background: linear-gradient(145deg, #FFD6E8, #D8EBC2);
    border-radius: 25px;
    padding: 30px 20px;
    border: 2px solid #F7A8C4;
    cursor: pointer;
    transition: .35s;
    box-shadow: 0 10px 25px rgba(111,143,82,.18);
}

.card:hover {
    transform: translateY(-10px) rotate(1deg);
    background: linear-gradient(145deg, #F7A8C4, #A8C686);
}

.emoji {
    font-size: 50px;
    margin-bottom: 10px;
}

.card h3 {
    color: #5B5148;
}

/* MEMORY GALLERY */

.secret {
    margin-top: 30px;
    background: linear-gradient(135deg, #FCE0EC, #E1EED1);
    padding: 25px;
    border-radius: 30px;
    color: #5B5148;
    animation: pop .5s ease;
    border: 2px solid rgba(247,168,196,.6);
}

@keyframes pop {
    from {
        opacity: 0;
        transform: scale(.8);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.secret h2 {
    color: #6F8F52;
    font-size: 1.7rem;
}

.gallery-subtitle {
    margin-top: 8px;
    margin-bottom: 25px;
    color: #5B5148;
    font-size: 14px;
}

.photo-gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.photo {
    background: #fff8fa;
    padding: 12px;
    border-radius: 18px;
    border: 2px solid #F7A8C4;
    box-shadow: 0 8px 20px rgba(111,143,82,.15);
    transition: .3s;
}

.photo:hover {
    transform: translateY(-6px) rotate(1deg);
}

.photo img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 12px;
    cursor: pointer;
    display: block;
}

.photo p {
    color: #6F8F52;
    font-size: 13px;
    margin-top: 10px;
    font-weight: 500;
}

/* BACK BUTTON */

.back-button {
    margin-top: 25px;
    background: linear-gradient(135deg, #F7A8C4, #E88BAF);
    color: white;
    font-size: 14px;
    padding: 12px 25px;
    box-shadow: 0 8px 18px rgba(232,139,175,.3);
}

.back-button:hover {
    background: linear-gradient(135deg, #E88BAF, #F7A8C4);
    transform: translateY(-4px);
}

/* FULLSCREEN PHOTO VIEWER */

.viewer {
    position: fixed;
    inset: 0;
    background: rgba(35, 30, 35, .92);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 20px;
}

.viewer img {
    max-width: 90%;
    max-height: 80vh;
    object-fit: contain;
    border: 8px solid white;
    border-radius: 12px;
    box-shadow: 0 15px 50px rgba(0,0,0,.4);
}

.close-viewer {
    position: absolute;
    top: 20px;
    right: 25px;
    color: white;
    font-size: 35px;
    background: none;
    box-shadow: none;
    padding: 5px 15px;
}

.close-viewer:hover {
    transform: scale(1.1);
}

.viewer-caption {
    position: absolute;
    bottom: 25px;
    color: white;
    font-size: 14px;
}

.footer {
    margin-top: 25px;
    color: #6F8F52;
    font-size: .9rem;
}

/* MOBILE RESPONSIVENESS */

@media(max-width:600px) {

    .container {
        padding: 25px;
    }

    h1 {
        font-size: 1.8rem;
    }

    .photo-gallery {
        grid-template-columns: 1fr;
    }

    .photo img {
        height: 230px;
    }

    button {
        width: 100%;
    }

    .close-viewer {
        width: auto;
    }

}

</style>
</head>

<body>

<div class="container">

    <h1>📸 Little Pieces of Us ♡</h1>

    <p class="subtitle">
    </p>

    <button id="enterButton" onclick="enterCafe()">
        🎞️ Step Into Our Little World ♡
    </button>

    <div id="cafe" class="hidden">

        <!-- MEMORY CARD -->

        <div class="cards">

            <div class="card" onclick="showMessage('memory')">

                <div class="emoji">🌸</div>

                <h3>Cute Memories</h3>

            </div>

        </div>

        <!-- PHOTO GALLERY -->

        <div id="popupMessage" class="secret hidden">

            <h2 id="popupTitle">
            </h2>

            <p class="gallery-subtitle">
            </p>

            <div class="photo-gallery">

                <div class="photo">
                    <img src="us.jpg"
                    alt="Our moment 1"
                    onclick="openViewer(this)">
                </div>

                <div class="photo">
                    <img src="uss.jpg"
                    alt="Our moment 2"
                    onclick="openViewer(this)">
                </div>

                <div class="photo">
                    <img src="usss.jpg"
                    alt="Our moment 3"
                    onclick="openViewer(this)">
                </div>

                <div class="photo">
                    <img src="usssss.jpg"
                    alt="Our moment 4"
                    onclick="openViewer(this)">
                </div>

                <div class="photo">
                    <img src="ussss.jpg"
                    alt="Our moment 5"
                    onclick="openViewer(this)">
                </div>

            </div>


            <button class="back-button" onclick="goBack()">
                ←Back
            </button>

        </div>

    </div>

    <div class="footer">
    </div>

</div>


<div id="photoViewer" class="viewer hidden"
onclick="closeViewer()">

    <button class="close-viewer"
    onclick="closeViewer()">×</button>

    <img id="viewerImage" src="" alt="Our memory">

    <p class="viewer-caption" id="viewerCaption"></p>

</div>

<script>

function enterCafe() {

    document.getElementById("cafe")
    .classList.remove("hidden");

    document.getElementById("enterButton")
    .classList.add("hidden");

}

function showMessage(type) {

    let box = document.getElementById("popupMessage");

    if (type === "memory") {

        document.getElementById("popupTitle").innerHTML =
        "🌸 Our Little Moments";

    }

    box.classList.remove("hidden");

    box.style.animation = "none";

    setTimeout(function() {
        box.style.animation = "pop .5s ease";
    }, 10);

}

function goBack() {

    document.getElementById("popupMessage")
    .classList.add("hidden");

}

function openViewer(img) {

    document.getElementById("viewerImage").src = img.src;

    document.getElementById("viewerCaption").innerText =
    img.alt;

    document.getElementById("photoViewer")
    .classList.remove("hidden");

}

function closeViewer() {

    document.getElementById("photoViewer")
    .classList.add("hidden");

}

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        closeViewer();
    }

});

</script>

</body>
</html>
